<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floor Plan • WIOT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rooms.css">
  <style>
    body { margin:0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #0f0f0f; color: #eee; }
    canvas { background: #111; border-right: 1px solid #444; display: block; }
    .sidebar {
      width: 200px;
      padding: 20px;
      background: var(--device-list-bg, #1e1e1e);
      border-right: 1px solid var(--device-list-border, #333);
      overflow-y: auto;
    }
    .right-sidebar { border-left: 1px solid #333; border-right: none; }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0a84ff; }
    .selected { background: #0a84ff !important; }
    h2 { margin-top: 0; }
.floor-list {
    max-height: 400px;
    overflow-y: auto;
}

.floor-item {
    padding: 12px 16px;
    margin: 4px 0;
    background: #2a2a2a;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
}

.floor-item:hover {
    background: #3a3a3a;
}

.floor-item.active {
    background: #0a84ff;
    color: white;
    font-weight: bold;
}  </style>
</head>
<body onload="initFloorplan()">

<!-- Left: Floors -->
  <div class="sidebar">
    <h2>📍 Floors</h2>
    <div id="floor-list" class="floor-list"></div>

    <div style="margin-top: 20px;">
      <button onclick="addFloor()" class="btn btn-primary" style="width:100%; margin-bottom:8px;">
        + Add Floor
      </button>
      <button onclick="removeFloor()" class="btn btn-danger" style="width:100%;">
        – Remove Floor
      </button>
    </div>
  </div>

  <!-- Canvas -->
  <div>
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <!-- Right Sidebar - Tools -->
  <div class="sidebar right-sidebar">
    <h2>🛠️ Tools</h2>
    <button onclick="splitSelected('h')">Split Horizontally</button>
    <button onclick="splitSelected('v')">Split Vertically</button>
    <button onclick="markAsOutside()">Mark as Outside</button>
    <!-- New Delete Button -->
    <button onclick="deleteSelectedRoom()" class="btn btn-danger" style="margin-top: 15px;">
      🗑️ Delete Selected Room
    </button>
   
    <hr style="margin: 20px 0; border-color: #444;">
    
    <button onclick="exportJSON()">📤 Export JSON</button>
    <button onclick="document.getElementById('import-input').click()">📥 Import JSON</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>

<script src="floorplan-data.js"></script>
<script src="floorplan-render.js"></script>
<script src="floorplan-tools.js"></script>
<script src="floorplan-io.js"></script>
<script src="floorplan.js"></script>
</body>
</html>
