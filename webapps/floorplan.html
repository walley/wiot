<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Floor Plan • WIOT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rooms.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-family: sans-serif;
      background: #0f0f0f;
      color: #eee;
    }

    .sidebar {
      width: 190px;
      background: var(--device-list-bg, #1e1e1e);
      border-right: 1px solid var(--device-list-border, #333);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .right-sidebar {
      border-right: none;
      border-left: 1px solid var(--device-list-border, #333);
    }

    .main-content {
      flex: 1;
      background: #111;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      background: #1a1a1a;
      width: 100%;
      height: 100%;
      display: block;
    }

    .floor-item {
      padding: 12px 16px;
      margin: 4px 0;
      background: #2a2a2a;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .floor-item:hover { background: #3a3a3a; }
    .floor-item.active {
      background: #0a84ff;
      color: white;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-primary { background: #0a84ff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
.add-cross {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 10px 0;
}

.cross-middle {
    display: flex;
    gap: 6px;
}

.cross-btn {
    padding: 10px 14px;
    font-size: 1rem;
    min-width: 80px;
}
  </style>
</head>
<body onload="initFloorplan()">

  <!-- Left Sidebar: Floors -->
  <div class="sidebar">
    <h2>🏠 Floors</h2>
    <div id="floor-list" class="floor-list"></div>
    
    <div style="margin-top: 20px;">
      <button onclick="addFloor()" class="btn btn-primary">+ Add Floor</button>
      <button onclick="removeFloor()" class="btn btn-danger">– Remove Floor</button>
    </div>
  </div>

  <!-- Canvas Area - Now fills full space -->
  <div class="main-content">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Right Sidebar: Tools -->
  <div class="sidebar right-sidebar">
    <h2>🛠️ Tools</h2>
    <button onclick="splitSelected('h')">Split Horizontally</button>
    <button onclick="splitSelected('v')">Split Vertically</button>
    <button onclick="markAsOutside()">Mark as Outside</button>
    <button onclick="deleteSelectedRoom()" class="btn btn-danger">🗑️ Delete Room</button>

<!-- Cross Shape Buttons -->
    <div class="add-cross">
      <button onclick="addRoomAdjacent('top')"    class="cross-btn">↑ Top</button>
      <div class="cross-middle">
        <button onclick="addRoomAdjacent('left')"  class="cross-btn">← Left</button>
        <button onclick="addRoomAdjacent('right')" class="cross-btn">Right →</button>
      </div>
      <button onclick="addRoomAdjacent('bottom')" class="cross-btn">↓ Bottom</button>
    </div>
    
    <hr style="margin: 20px 0; border-color: #444;">
    <button onclick="exportJSON()">📤 Export JSON</button>
    <button onclick="importJSON()">📥 Import JSON</button>
  </div>

  <script src="floorplan-data.js"></script>
  <script src="floorplan-render.js"></script>
  <script src="floorplan-tools.js"></script>
  <script src="floorplan-io.js"></script>
  <script src="floorplan.js"></script>
</body>
</html>
