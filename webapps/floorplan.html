<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Floor Plan • WIOT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rooms.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      font-family: sans-serif;
      background: #0f0f0f;
      color: #eee;
    }

    .sidebar {
      width: 190px;
      background: var(--device-list-bg, #1e1e1e);
      border-right: 1px solid var(--device-list-border, #333);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .right-sidebar {
      border-right: none;
      border-left: 1px solid var(--device-list-border, #333);
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #111;
      overflow: hidden;
    }

    .ruler-top {
      height: 28px;
      background: #1e1e1e;
      border-bottom: 1px solid #444;
      position: relative;
      flex-shrink: 0;
    }

    .canvas-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .ruler-left {
      width: 28px;
      background: #1e1e1e;
      border-right: 1px solid #444;
      position: relative;
      flex-shrink: 0;
    }

    #canvas {
      background: #1a1a1a;
      display: block;
    }

    /* Button Styles - Restored */
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary, 
    button:not(.btn-danger) {
      background: #0a84ff;
      color: white;
    }

    button:hover:not(.btn-danger) {
      background: #0066cc;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background: #c82333;
    }

    .floor-item {
      padding: 12px 16px;
      margin: 4px 0;
      background: #2a2a2a;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .floor-item:hover { background: #3a3a3a; }
    .floor-item.active {
      background: #0a84ff;
      color: white;
      font-weight: bold;
    }

    .add-cross {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 12px 0;
    }
    .cross-middle {
      display: flex;
      gap: 6px;
    }
    .cross-btn {
      padding: 10px 14px;
      font-size: 1rem;
      min-width: 85px;
    }
  </style>
</head>
<body onload="initFloorplan()">

  <!-- Left Sidebar: Floors -->
  <div class="sidebar">
    <h2>🏠 Floors</h2>
    <div id="floor-list" class="floor-list"></div>
    
    <div style="margin-top: 20px;">
      <button onclick="addFloor()" class="btn-primary">+ Add Floor</button>
      <button onclick="removeFloor()" class="btn-danger">– Remove Floor</button>
    </div>
  </div>

  <!-- Main Canvas Area with Rulers -->
  <div class="main-area">
    <!-- Top Ruler -->
    <div id="ruler-top" class="ruler-top"></div>

    <div class="canvas-container">
      <!-- Left Ruler -->
      <div id="ruler-left" class="ruler-left"></div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <!-- Right Sidebar: Tools -->
  <div class="sidebar right-sidebar">
    <h2>🛠️ Tools</h2>
    
    <button onclick="splitSelected('h')">Split Horizontally</button>
    <button onclick="splitSelected('v')">Split Vertically</button>
    <button onclick="markAsOutside()">Mark as Outside</button>
    <button onclick="deleteSelectedRoom()" class="btn-danger">🗑️ Delete Room</button>
    <button onclick="recenterAll()">🎯 Recenter</button>

    <hr style="margin: 25px 0 15px 0; border-color: #444;">
    
    <p style="margin: 10px 0 8px; font-size: 0.95rem; color: #aaa;">Add Adjacent Room</p>
    
    <div class="add-cross">
      <button onclick="addRoomAdjacent('top')"    class="cross-btn">↑ Top</button>
      <div class="cross-middle">
        <button onclick="addRoomAdjacent('left')"  class="cross-btn">← Left</button>
        <button onclick="addRoomAdjacent('right')" class="cross-btn">Right →</button>
      </div>
      <button onclick="addRoomAdjacent('bottom')" class="cross-btn">↓ Bottom</button>
    </div>

    <hr style="margin: 25px 0 15px 0; border-color: #444;">
    <!-- New Zoom Controls -->
    <p style="margin: 15px 0 8px; font-size: 0.95rem; color: #aaa;">Zoom</p>
    <div style="display: flex; gap: 6px;">
      <button onclick="zoomOut()" style="flex:1;">–</button>
      <button onclick="resetZoom()" style="flex:1; background:#555;">100%</button>
      <button onclick="zoomIn()" style="flex:1;">+</button>
    </div>
    <button onclick="exportJSON()">📤 Export JSON</button>
    <button onclick="importJSON()">📥 Import JSON</button>
  </div>

  <script src="floorplan-data.js"></script>
  <script src="floorplan-render.js"></script>
  <script src="floorplan-tools.js"></script>
  <script src="floorplan-io.js"></script>
  <script src="floorplan.js"></script>
</body>
</html>
