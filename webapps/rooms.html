<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">

  <title>Rooms • WIOT</title>

  <link rel="stylesheet" href="rooms.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="//code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  <script src="rooms.js"></script>
  <script src="menu/menu.js"></script>

</head>

<body onload="init_menu()">

<div class="topcorner">
  <div id="navmenu" class="navmenu">
    <img src="picz/bora.png" width="24px" height="24px">
    <img src="picz/navmenu.png" width="20px" height="20px">
  </div>
</div>

<ul id="menu" class="topcornermenu initially_hidden"></ul>

<div class="container">
  <h1>🏠 Rooms Manager</h1>
  <p class="subtitle">Manage your smart home locations</p>

  <!-- Room List -->
  <div class="section">
    <h2>Your Rooms <span id="room-count" class="count"></span></h2>
    <div id="rooms_list" class="rooms-grid"></div>
  </div>

  <!-- Add Room -->
  <div class="section card">
    <h2>➕ Add New Room</h2>
    <div class="input-group">
      <input id="add_room" type="text" placeholder="e.g. Living Room, Kitchen, Bedroom">
      <button onclick="add_room()" class="btn btn-primary">Add Room</button>
    </div>
  </div>

  <!-- Remove Room -->
  <div class="section card">
    <h2 class="text-red">🗑️ Remove Room</h2>
    <div class="input-group">
      <input id="delinput" type="text" placeholder="Enter room name to delete">
      <button onclick="xxdelete()" class="btn btn-danger">Delete</button>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
  get_username();
  refresh_list();
</script>

</body>
</html>
