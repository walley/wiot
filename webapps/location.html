<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Location Selector</title>
    <!-- Include Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Include jQuery UI CSS for the menu -->
    <link rel="stylesheet" href="//code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <!-- Include OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
    <!-- Include jQuery and jQuery UI -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
    <!-- Include OpenLayers -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
    <!-- Include menu.js -->
    <script src="menu/menu.js"></script>
    <style>
        /* General page styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        /* Map styles */
        #map {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Menu styles (copied from house.html and rooms.css) */
        .topcorner {
            position: absolute;
            top: 0px;
            right: 0px;
        }

        .topcornermenu {
            position: absolute;
            top: 30px;
            right: 0;
        }

        .ui-menu {
            width: 200px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .ui-menu li {
            padding: 8px;
            cursor: pointer;
        }

        .ui-menu li:hover {
            background-color: #e0e0e0;
        }

        .ui-menu-divider {
            height: 1px;
            background-color: #ddd;
            margin: 5px 0;
        }

        .navmenu {
            border-style: double;
            display: inline-block;
            height: 24px;
            cursor: pointer;
            border-color: #0056b3;
        }

        .initially_hidden {
            display: none;
        }

        /* Responsive design for the menu */
        @media (max-width: 600px) {
            .topcornermenu, .ui-menu {
                width: 150px;
                right: 10px;
            }
        }
    </style>
</head>
<body onload="init_menu()">
    <!-- Navigation Menu -->
    <div class="topcorner">
        <div id="navmenu" class="navmenu" role="button" aria-label="Toggle navigation menu" aria-expanded="false" tabindex="0">
            <img src="bora.png" width="24px" height="24px" alt="Logo">
            <img src="navmenu.png" width="20px" height="20px" alt="Menu">
        </div>
    </div>

    <ul id="menu" class="topcornermenu initially_hidden">
        <!-- Menu items will be populated dynamically from menu.json -->
    </ul>

    <!-- Location Selector Content -->
    <h1>IoT Location Selector</h1>
    <p>Click on the map to select a location for your house.</p>
    <div id="map"></div>

    <script>
        // Initialize the OpenLayers map
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM() // Use OpenStreetMap as the tile source
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([0, 0]), // Center the map at [0, 0] (will be updated to user's location)
                zoom: 2 // Initial zoom level
            })
        });

        // Try to center the map on the user's location (if geolocation is available)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    const coords = ol.proj.fromLonLat([position.coords.longitude, position.coords.latitude]);
                    map.getView().setCenter(coords);
                    map.getView().setZoom(15); // Zoom in to the user's location
                },
                error => {
                    console.warn("Geolocation failed:", error.message);
                }
            );
        }

        // Add a click event to the map to select a location
        map.on('singleclick', function(event) {
            const coords = event.coordinate;
            const lonLat = ol.proj.toLonLat(coords); // Convert map coordinates to longitude/latitude
            const lon = lonLat[0];
            const lat = lonLat[1];

            // Use Nominatim API for reverse geocoding
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;

            fetch(url, {
                headers: {
                    'User-Agent': 'IoTLocationSelector/1.0' // Nominatim requires a User-Agent
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.display_name) {
                    const address = data.display_name;
                    alert(`Selected Location:\nLatitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}\nAddress: ${address}`);
                } else {
                    alert(`Selected Location:\nLatitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}\nAddress: Unable to retrieve address.`);
                }
            })
            .catch(error => {
                console.error("Reverse geocoding failed:", error);
                alert(`Selected Location:\nLatitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}\nAddress: Error retrieving address.`);
            });
        });
    </script>
</body>
</html>
