<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Room Selector</title>
    <!-- Include Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Include jQuery UI CSS for the menu -->
    <link rel="stylesheet" href="//code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <!-- Include jQuery and jQuery UI -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
    <!-- Include menu.js -->
    <script src="menu/menu.js"></script>
    <style>
        /* Existing styles for the room selector */
        .room-selector {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
            background-color: #f0f0f0;
            margin: 10px 0;
            user-select: none;
            cursor: grab;
        }

        .room-selector.grabbing {
            cursor: grabbing;
        }

        .room-button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .room-button:hover {
            background-color: #0056b3;
        }

        .room-button:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .room-selector::-webkit-scrollbar {
            display: none;
        }

        .room-selector {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .device-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }

        .device-list li {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .device-list i {
            margin-right: 10px;
            color: #007bff;
        }

        .device-list li:hover {
            background-color: #f9f9f9;
        }

        .header-container {
            display: flex;
            align-items: center;
        }

        .header-container h1 {
            margin-right: 10px;
        }

        .edit-icon {
            color: #007bff;
            font-size: 20px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .edit-icon:hover {
            color: #0056b3;
        }

        /* New styles for the menu (copied from rooms.css) */
        .topcorner {
            position: absolute;
            top: 0px;
            right: 0px;
        }

        .topcornermenu {
            position: absolute;
            top: 30px;
            right: 0;
        }

        .ui-menu {
            width: 200px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .ui-menu li {
            padding: 8px;
            cursor: pointer;
        }

        .ui-menu li:hover {
            background-color: #e0e0e0;
        }

        .ui-menu-divider {
            height: 1px;
            background-color: #ddd;
            margin: 5px 0;
        }

        .navmenu {
            border-style: double;
            display: inline-block;
            height: 24px;
            cursor: pointer;
            border-color: #0056b3;
        }

        .initially_hidden {
            display: none;
        }

        /* Responsive design for the menu */
        @media (max-width: 600px) {
            .topcornermenu, .ui-menu {
                width: 150px;
                right: 10px;
            }
        }
    </style>
</head>
<body onload="init_menu()">
    <!-- Add the menu -->
    <div class="topcorner">
        <div id="navmenu" class="navmenu" role="button" aria-label="Toggle navigation menu" aria-expanded="false" tabindex="0">
            <img src="bora.png" width="24px" height="24px" alt="Logo">
            <img src="navmenu.png" width="20px" height="20px" alt="Menu">
        </div>
    </div>

    <ul id="menu" class="topcornermenu initially_hidden">
        <!-- Menu items will be populated dynamically from menu.json -->
    </ul>

    <!-- Existing room selector content -->
    <div class="header-container">
        <h1>IoT Room Selector</h1>
        <a href="https://wiot.cz/webapps/rooms.html" class="edit-icon" title="Edit Rooms">
            <i class="fas fa-edit"></i>
        </a>
    </div>
    <div id="roomSelector" class="room-selector"></div>
    <div id="deviceListContainer">
        <h2 id="selectedRoom"></h2>
        <ul id="deviceList" class="device-list"></ul>
    </div>

    <script>
        // Array of rooms (example data)
        const rooms = [
            "Living Room",
            "Kitchen",
            "Bedroom",
            "Bathroom",
            "Office",
            "Garage",
            "Basement",
            "Guest Room",
            "Dining Room",
            "Library"
        ];

        // Example IoT devices for each room
        const iotDevices = {
            "Living Room": [
                { name: "Ceiling Light", type: "lightbulb", icon: "fa-lightbulb" },
                { name: "Smart Switch", type: "switch", icon: "fa-toggle-on" },
                { name: "TV Power", type: "switch", icon: "fa-toggle-on" }
            ],
            "Kitchen": [
                { name: "Fridge Light", type: "lightbulb", icon: "fa-lightbulb" },
                { name: "Oven Switch", type: "switch", icon: "fa-toggle-on" }
            ],
            "Bedroom": [
                { name: "Bedside Lamp", type: "lightbulb", icon: "fa-lightbulb" },
                { name: "Fan Switch", type: "switch", icon: "fa-toggle-on" }
            ],
            "Bathroom": [
                { name: "Mirror Light", type: "lightbulb", icon: "fa-lightbulb" }
            ],
            "Office": [
                { name: "Desk Lamp", type: "lightbulb", icon: "fa-lightbulb" },
                { name: "Monitor Switch", type: "switch", icon: "fa-toggle-on" }
            ],
            "Garage": [
                { name: "Garage Door Switch", type: "switch", icon: "fa-toggle-on" }
            ],
            "Basement": [
                { name: "Basement Light", type: "lightbulb", icon: "fa-lightbulb" }
            ],
            "Guest Room": [
                { name: "Guest Lamp", type: "lightbulb", icon: "fa-lightbulb" }
            ],
            "Dining Room": [
                { name: "Chandelier", type: "lightbulb", icon: "fa-lightbulb" },
                { name: "Dimmer Switch", type: "switch", icon: "fa-toggle-on" }
            ],
            "Library": [
                { name: "Reading Light", type: "lightbulb", icon: "fa-lightbulb" }
            ]
        };

        // Function to create and populate the room selector
        function createRoomSelector() {
            const roomSelector = document.getElementById("roomSelector");
            const selectedRoomHeader = document.getElementById("selectedRoom");
            const deviceList = document.getElementById("deviceList");

            rooms.forEach(room => {
                const button = document.createElement("button");
                button.className = "room-button";
                button.textContent = room;
                button.addEventListener("click", () => {
                    selectedRoomHeader.textContent = `Devices in ${room}`;
                    deviceList.innerHTML = "";
                    const devices = iotDevices[room] || [];
                    if (devices.length === 0) {
                        const li = document.createElement("li");
                        li.textContent = "No devices found.";
                        deviceList.appendChild(li);
                    } else {
                        devices.forEach(device => {
                            const li = document.createElement("li");
                            const icon = document.createElement("i");
                            icon.className = `fas ${device.icon}`;
                            li.appendChild(icon);
                            li.appendChild(document.createTextNode(device.name));
                            deviceList.appendChild(li);
                        });
                    }
                });
                roomSelector.appendChild(button);
            });

            // Add mouse gesture scrolling
            let isDown = false;
            let startX;
            let scrollLeft;

            roomSelector.addEventListener("mousedown", (e) => {
                isDown = true;
                roomSelector.classList.add("grabbing");
                startX = e.pageX - roomSelector.offsetLeft;
                scrollLeft = roomSelector.scrollLeft;
            });

            roomSelector.addEventListener("mouseleave", () => {
                isDown = false;
                roomSelector.classList.remove("grabbing");
            });

            roomSelector.addEventListener("mouseup", () => {
                isDown = false;
                roomSelector.classList.remove("grabbing");
            });

            roomSelector.addEventListener("mousemove", (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - roomSelector.offsetLeft;
                const walk = (x - startX) * 2;
                roomSelector.scrollLeft = scrollLeft - walk;
            });

            selectedRoomHeader.textContent = "Select a room to view devices";
        }

        window.onload = function() {
            init_menu(); // Already called via onload attribute, but included here for clarity
            createRoomSelector();
        };
    </script>
</body>
</html>
